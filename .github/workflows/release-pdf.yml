name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build handbook PDF
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            ubuntu:24.04 \
            sh -c 'export DEBIAN_FRONTEND=noninteractive && \
              apt-get update && \
              apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-lang-chinese fonts-noto-cjk && \
              pandoc /data/README.md /data/docs/supplement.md \
                --from=gfm --standalone --toc --number-sections \
                --pdf-engine=xelatex \
                -V CJKmainfont="FandolSong" \
                -V geometry:margin=1.8cm \
                -V pagestyle=plain \
                -o /data/hust-three-boars-template.pdf'
      - uses: actions/upload-artifact@v4
        with:
          name: hust-three-boars-template-pdf
          path: ./hust-three-boars-template.pdf

      - name: Attach PDF to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hust-three-boars-template.pdf

